name: Build KAIZEN Android APK (Layer 2 Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 21 (for Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies & Generate Android Native Project
        working-directory: ./mobile
        run: |
          npm install --no-audit --no-fund
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable KAIZEN Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaizen-trader-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
